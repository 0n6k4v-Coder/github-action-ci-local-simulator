name: needs-outputs

on: push

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - id: meta
        run: echo "version=1.2.3" >> "$GITHUB_OUTPUT"

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - run: echo "version=${{ needs.build.outputs.version }}"
