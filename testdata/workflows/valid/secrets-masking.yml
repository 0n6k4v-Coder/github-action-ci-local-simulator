name: secrets-masking

on: push

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SECRET_TOKEN: super-secret-value-12345
    steps:
      - name: Print secret (should be masked)
        run: echo "My token is $SECRET_TOKEN"
        
      - name: Verify masking
        run: echo "Verifying secret token $SECRET_TOKEN is masked"
