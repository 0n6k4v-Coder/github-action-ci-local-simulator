name: action-with-interpolation

on: push

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python with interpolated version
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Verify Python
        run: python3 --version
