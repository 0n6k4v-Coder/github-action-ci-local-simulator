name: parallel-simple

on: push

jobs:
  job1:
    runs-on: ubuntu-latest
    steps:
      - run: sleep 2 && echo "job1 done"

  job2:
    runs-on: ubuntu-latest
    steps:
      - run: sleep 2 && echo "job2 done"

  job3:
    runs-on: ubuntu-latest
    needs: [job1, job2]
    steps:
      - run: echo "job3 done (should start after ~2 seconds, not 4)"
